version: '3.8'

services:
  blazor-component-library:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blazor-component-library
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  default:
    name: blazor-network
